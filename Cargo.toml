[workspace]
resolver = "2"
members = ["crates/tihu-core", "crates/tihu-cli", "crates/tihu-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.release-wasm]
inherits = "release"
opt-level = "z"
lto = true
# 名字节这些调试段落对运行没有用，网页要的只有字节数
strip = true
